[package]
name = "urban_social"
version = "0.1.0"
description = "Programa Solana do Urban Secure Social: perfil, claim/streak, treasury e premiação semanal"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "urban_social"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Exigida pelo `init_if_needed` em ClaimDaily. O Anchor esconde essa opção
# atrás de uma feature porque ela é fácil de usar errado: uma conta
# reinicializável permitiria zerar estado alheio. Aqui é segura porque o PDA
# é derivado da chave do signatário — ninguém alcança a conta de outro — e
# porque o código trata explicitamente o caso "conta recém-criada" checando
# `wallet == Pubkey::default()`.
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
